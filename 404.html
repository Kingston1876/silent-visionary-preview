<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Silent Visionary</title>
    <meta name="description" content="This page doesn't exist on Silent Visionary." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="v2-merged/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #090c11;
        --navy: #0d1524;
        --charcoal: #141b26;
        --line: #242e3d;
        --text: #e7ebf1;
        --text-dim: #93a1b4;
        --text-faint: #7a87a3;
        --gold: #c9a15a;
        --gold-bright: #e4c483;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background:
          radial-gradient(ellipse at 28% 22%, rgba(34, 211, 238, 0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 76% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 90% 15%, rgba(37, 99, 235, 0.11) 0%, transparent 45%),
          linear-gradient(180deg, var(--ink) 0%, var(--navy) 60%, var(--navy) 100%);
        color: var(--text);
        font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 40px 24px;
      }
      .brand {
        display: flex; align-items: center; gap: 10px; margin-bottom: 56px;
        font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
        text-decoration: none; color: var(--text);
      }
      .brand img { height: 30px; width: auto; }
      .code {
        font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
        display: flex; align-items: center; gap: 10px;
      }
      .code::before { content: ""; width: 24px; height: 1px; background: var(--gold); opacity: 0.6; }
      h1 {
        font-family: "Archivo", sans-serif; font-weight: 800; letter-spacing: -0.01em;
        font-size: clamp(32px, 5vw, 52px); margin: 18px 0 14px; text-wrap: balance;
      }
      p.lede {
        color: var(--text-dim); font-size: 16px; line-height: 1.6; max-width: 480px; margin: 0 0 34px;
      }
      .ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      .btn {
        font-family: "Public Sans", sans-serif; font-size: 13.5px; font-weight: 600;
        padding: 12px 22px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .btn-gold { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a1305; }
      .btn-ghost { border: 1px solid var(--line); color: var(--text); background: transparent; }
      .btn:hover { transform: translateY(-1px); }
      .btn-ghost:hover { border-color: var(--gold); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="/v2-merged/index.html" class="brand">
        <img src="v2-merged/LOGO-icon.png" alt="Silent Visionary" />
        SILENT VISIONARY
      </a>
      <div class="code">404 &middot; Page Not Found</div>
      <h1>This trail went cold.</h1>
      <p class="lede">The page you're looking for doesn't exist, moved, or the link's broken. Let's get you back on the case.</p>
      <div class="ctas">
        <a href="/v2-merged/index.html" class="btn btn-gold">Back to Silent Visionary</a>
        <a href="/v2-merged/contact.html" class="btn btn-ghost">Contact Us</a>
      </div>
    </div>
  </body>
</html>
